version: 1

formatters:
  json:
    (): src.utils.logger.JsonFormatter
    format: "%(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: json
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: INFO
    formatter: json
    filename: artifacts/logs/app.log
    encoding: utf-8

loggers:
  student_performance_indicator:
    level: INFO
    handlers: [console, file]
    propagate: false

root:
  level: INFO
  handlers: [console]
