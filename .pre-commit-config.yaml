repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: ["--line-length=88", "--target-version=py313"]
        language_version: python3.13

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: ["check", "--fix", "--target-version=py313"]
        language_version: python3.13

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        args: ["--python-version=3.13", "--ignore-missing-imports"]
        additional_dependencies:
          - types-PyYAML
        language_version: python3.13

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.1
    hooks:
      - id: bandit
        args: ["--severity-level", "medium"]
        files: ^src/
        exclude: tests/
        language_version: python3.13

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
        args: ["--cov=src", "--cov-fail-under=75", "-v"]

      - id: pip-audit
        name: pip-audit
        entry: pip-audit
        args: ["--skip-editable"]
        language: system
        pass_filenames: false
        stages: [pre-push]